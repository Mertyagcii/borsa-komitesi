name: Veri guncelle ve yayinla

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dakikada bir (GitHub gecikebilir)
  workflow_dispatch:          # elle de baslatilabilir
  push:
    branches: [main]

permissions:
  contents: write   # history.json'i depoya kaydetmek icin
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fiyat gecmisi (gunde bir kez, kapanistan sonra)
        run: python history.py --if-stale
      - name: Sistem arastirmasi (haftada bir)
        run: python research.py --if-stale
      - name: Cok zamanli gosterge arastirmasi (haftada bir)
        env:
          WIDE_CAP: "250"
        run: python mtf_run.py --if-stale
      - name: Dis veriler (VIOP vadeli primi, Google Haberler ilgisi, GDELT; gunde bir kez)
        run: python extdata.py
      - name: history.json degistiyse kaydet
        run: |
          if [ -n "$(git status --porcelain history.json ohlcv.json)" ]; then
            git config user.name "tradingofis-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json ohlcv.json
            git commit -m "history.json guncellendi"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python build_site.py
      - name: Testler (yalnizca kod degisikliginde; bir kez yeniden denenir)
        if: github.event_name == 'push'
        run: python tests/run_tests.py --site site || python tests/run_tests.py --site site
      - name: Komite karnesi kaydi ve uyarilar (gunde bir kez, kapanistan sonra)
        run: node signals.js
      - name: Gun ici 15 dakikalik cubuklar (yalnizca islenecek yeni islem gunu varsa)
        run: python intraday.py
      - name: Anlik alarm motoru (seans icinde; yeni kritik alarm varsa webhook ve Telegram)
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node alarms.js
          if [ -f alarms.txt ]; then
            if [ -n "$ALARM_WEBHOOK_URL" ]; then
              python -c "import json,sys;t=open('alarms.txt',encoding='utf-8').read();print(json.dumps({'text':t,'content':t}))" | curl -s -X POST -H "Content-Type: application/json" -d @- "$ALARM_WEBHOOK_URL" > /dev/null || true
            fi
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$(cat alarms.txt)" > /dev/null || true
            fi
          fi
      - name: Sanal portfoyler (gunde bir kez, kapanistan sonra)
        run: node engine.js
      - name: Seans kapanisi arsivi (Arsiv/*.md, gunde bir kez, kapanistan sonra)
        run: node archive.js
      - name: picks/snapshots/portfolios degistiyse kaydet
        run: |
          FILES=""; for f in picks.json snapshots.json portfolios.json research.json research_history.json mtf_research.json mtf_composite.json mtf_walkforward.json mtf_log.json daytrade_research.json overnight_research.json limit_research.json ipo_research.json scan_log.json kurul2_research.json macro_research.json viop.json viop_research.json newsmood.json newsmood_log.json geo.json news_log.json alarm_log.json alarm_state.json Arsiv fundamentals; do [ -e "$f" ] && FILES="$FILES $f"; done
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "tradingofis-bot"
            git config user.email "bot@users.noreply.github.com"
            git add $FILES
            git commit -m "karne/portfoy kaydi guncellendi"
            git pull --rebase origin main
            git push
          fi
      - name: Telegram uyarisi (TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID tanimliysa)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] && [ -f alerts.txt ]; then
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$(cat alerts.txt)" > /dev/null
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
