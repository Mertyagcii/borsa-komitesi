name: Veri guncelle ve yayinla

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dakikada bir (GitHub gecikebilir)
  workflow_dispatch:          # elle de baslatilabilir
  push:
    branches: [main]

permissions:
  contents: write   # history.json'i depoya kaydetmek icin
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fiyat gecmisi (gunde bir kez, kapanistan sonra)
        run: python history.py --if-stale
      - name: history.json degistiyse kaydet
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name "tradingofis-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json
            git commit -m "history.json guncellendi"
            git push
          fi
      - run: python build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
