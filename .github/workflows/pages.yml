name: Veri guncelle ve yayinla

on:
  schedule:
    - cron: "42 3,4,5,6 * * 1-5"   # sabah başlatma (06:42-09:42 TR): zincir (zincir.yml) hangi çalışmayla başlarsa başlasın kendini sürdürür
    - cron: "4,19,34,49 * * * *"   # 15 dakikada bir; tam saat/çeyrek başları GitHub'da en yoğun anlardır, çalışmalar oralarda atlanıyor (ölçülen: 386 saatte 1544 yerine 97 çalışma)
  workflow_dispatch:          # elle de baslatilabilir
  push:
    branches: [main]

permissions:
  contents: write   # history.json'i depoya kaydetmek icin
  pages: write
  id-token: write
  actions: write    # zincir.yml'yi tetiklemek icin (kendi kendini suren veri dongusu)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main → çalışma BAŞLARKEN main'in en güncel ucu indirilir. Aksi halde kuyrukta bekleyen çalışma (concurrency) tetiklendiği andaki bayat commit'i indirir,
      # önceki çalışma veri dosyalarını push edince "git pull --rebase" tek satırlık JSON'larda çakışır (2 Kasım'da yaşandı).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fiyat gecmisi (gunde bir kez, kapanistan sonra)
        run: python history.py --if-stale
      # Haftalik agir arastirma (research.py, mtf_run.py) ayri is akisinda: research.yml. Burada olursa 15 dakikalik veri dongusunu bloklar.
      - name: Dis veriler (VIOP vadeli primi, Google Haberler ilgisi, GDELT; gunde bir kez)
        run: python extdata.py
      - name: history.json degistiyse kaydet
        run: |
          if [ -n "$(git status --porcelain history.json ohlcv.json candles.json)" ]; then
            git config user.name "tradingofis-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json ohlcv.json candles.json
            git commit -m "history.json guncellendi"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python build_site.py
      - name: Testler (yalnizca kod degisikliginde; bir kez yeniden denenir)
        if: github.event_name == 'push'
        run: python tests/run_tests.py --site site || python tests/run_tests.py --site site
      - name: Komite karnesi kaydi ve uyarilar (gunde bir kez, kapanistan sonra)
        run: node signals.js
      - name: Gun ici 15 dakikalik cubuklar (yalnizca islenecek yeni islem gunu varsa)
        run: python intraday.py
      - name: Anlik alarm motoru (seans icinde; yeni kritik alarm varsa webhook ve Telegram)
        env:
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node alarms.js
          node notify.js alarms.txt
      - name: Sanal portfoyler (gunde bir kez, kapanistan sonra)
        run: node engine.js
      - name: Seans kapanisi arsivi (Arsiv/*.md, gunde bir kez, kapanistan sonra)
        run: node archive.js
      - name: picks/snapshots/portfolios degistiyse kaydet
        run: |
          FILES=""; for f in picks.json snapshots.json portfolios.json research.json research_history.json mtf_research.json mtf_composite.json mtf_walkforward.json mtf_log.json seal_log.json seal_card.json seal_hist.json analyst_log.json analyst_card.json analyst_now.json calendar_log.json calendar_research.json daytrade_research.json overnight_research.json limit_research.json ipo_research.json scan_log.json kurul2_research.json macro_research.json viop.json viop_research.json stress.json newsmood.json newsmood_log.json geo.json news_log.json alarm_log.json alarm_state.json Arsiv fundamentals; do [ -e "$f" ] && FILES="$FILES $f"; done
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "tradingofis-bot"
            git config user.email "bot@users.noreply.github.com"
            git add $FILES
            git commit -m "karne/portfoy kaydi guncellendi"
            git pull --rebase origin main
            git push
          fi
      - name: Telegram uyarisi (TELEGRAM_BOT_TOKEN ve TELEGRAM_CHAT_ID tanimliysa)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALARM_WEBHOOK_URL: ${{ secrets.ALARM_WEBHOOK_URL }}
        run: node notify.js alerts.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      # Zincir: GitHub'in schedule'i gercekte ~4 saatte bir calisiyor. Bu adim, piyasa saatlerinde bir sonraki calismayi (zincir.yml uzerinden, anahtar gerektirmeden) planlar.
      - name: Zincir (sonraki calismayi kendisi planlar; disaridan tetikleyici gerekmez)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WAIT=$(python zincir.py)
          echo "sonraki calisma icin bekleme: ${WAIT} sn (0 = zincir bu saatte durur)"
          if [ "$WAIT" -gt 0 ]; then gh workflow run zincir.yml --repo "$GITHUB_REPOSITORY" --ref main -f bekle="$WAIT"; fi
